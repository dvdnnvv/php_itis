home.label: "For people who love reading"
home.title: "A good book and a chat over tea"
home.intro: "We choose one book each month, read at our own pace and meet to share our thoughts."
home.text: "You can join for the first time, listen to others or tell us about a book you recently read. New members are welcome."
home.button: "See our meetings"
about.label: "Get to know us"
about.title: "About our club"
about.intro: "We are a small group of people who enjoy reading and sharing opinions."
about.subtitle: "How it works"
about.text: "At the start of each month, we choose a book together. At the meeting, we discuss the story, the characters and the questions that came up as we read."
about.note: "We do not have to agree with each other. What matters is giving everyone a chance to speak."
meetings.label: "Our plans"
meetings.title: "Club meetings"
meetings.intro: "We meet on Saturdays. We agree on the exact time and place together with the participants."
meetings.first.title: "Book of the month discussion"
meetings.first.text: "We share our impressions and discuss the characters and their choices. Feel free to bring your favourite quotes."
meetings.second.title: "Book swap"
meetings.second.text: "Bring books you have finished and are happy to share, and pick something new to read."
meetings.note: "You are welcome even if you have not finished the book. Just let us know if you want to avoid spoilers."
