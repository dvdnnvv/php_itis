home.label: "Для тех, кто любит читать"
home.title: "Хорошая книга и разговор за чашкой чая"
home.intro: "Выбираем одну книгу в месяц, читаем в своём темпе и встречаемся, чтобы обсудить впечатления."
home.text: "Можно прийти впервые, послушать других или рассказать о книге, которую недавно прочитали. Мы рады новым участникам."
home.button: "Посмотреть встречи"
about.label: "Знакомство"
about.title: "О нашем клубе"
about.intro: "Мы небольшая компания людей, которым нравится читать и делиться мнением."
about.subtitle: "Как всё устроено"
about.text: "В начале месяца вместе выбираем книгу. На встрече обсуждаем сюжет, героев и вопросы, которые возникли во время чтения."
about.note: "Не обязательно соглашаться друг с другом. Главное, дать каждому высказаться."
meetings.label: "Наши планы"
meetings.title: "Встречи клуба"
meetings.intro: "Собираемся по субботам. Точное время и место договариваемся выбрать вместе с участниками."
meetings.first.title: "Обсуждение книги месяца"
meetings.first.text: "Делимся впечатлениями и обсуждаем поступки героев. Можно принести любимые цитаты."
meetings.second.title: "Обмен книгами"
meetings.second.text: "Приносите прочитанные книги, которыми готовы поделиться, и выбирайте что-нибудь новое."
meetings.note: "Если вы ещё не дочитали книгу, всё равно приходите. Только предупредите, если не хотите слышать спойлеры."
